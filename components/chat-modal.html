<div class="chat-popup" id="chatPopup">
  <div class="chat-header" id="chatHeaderBar">
    <h4 id="chatUserName">User Name</h4>
    <div class="chat-actions">
      <button class="minimize-btn" id="minimizeChatBtn">&minus;</button>
      <button class="close-btn" id="closeChatBtn">&times;</button>
    </div>
  </div>
  <div class="chat-body" id="chatMessages"></div>
  <div class="chat-footer" id="chatFooter">
    <input
      type="text"
      id="chatInput"
      placeholder="Type a message..."
      data-i18n="chat.placeholder"
    />
    <button id="sendMessageBtn" data-i18n-title="chat.send">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>
