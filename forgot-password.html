<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog - Quên mật khẩu</title>
    <link rel="stylesheet" href="./styles/forgot-password.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="forgot-password-container">
        <h2 data-i18n="auth.forgotPassword">Quên mật khẩu</h2>
        <p
          style="text-align: center; margin-bottom: 20px; color: #555"
          data-i18n="auth.forgotPasswordDesc"
        >
          Nhập địa chỉ email của bạn để nhận liên kết đặt lại mật khẩu.
        </p>
        <form class="forgot-password-form">
          <div class="form-group">
            <label for="email" data-i18n="auth.email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              data-i18n-placeholder="auth.emailPlaceholder"
              placeholder="Nhập email..."
              required
            />
            <p class="error-message" id="email-error"></p>
          </div>
          <button
            type="button"
            class="btn submit-btn"
            onclick="forgotPassword()"
          >
            <span data-i18n="auth.sendResetLink">Gửi liên kết</span>
            <div class="loader"></div>
          </button>
          <div class="back-link">
            <a href="login.html" data-i18n="auth.backToLogin"
              >Quay lại đăng nhập</a
            >
          </div>
        </form>
      </div>
      <div id="toast-container" class="toast-container"></div>
    </main>
    <!-- <div id="footer"></div> -->
    <script src="./scripts/loading.js"></script>
    <script src="./scripts/config.js"></script>
    <script src="./scripts/translator.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/forgot-password.js"></script>
  </body>
</html>
