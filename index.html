<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="container">
        <div class="create-post">
          <img
            src="./assets/img/avt.jpg"
            alt="avt"
            width="60"
            height="60"
            class="avt"
          />
          <input type="text" placeholder="Tạo bài viết" class="" />
        </div>
        <div class="modal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Tạo bài viết mới</h2>
            <input type="text" placeholder="Tiêu đề bài viết..." />
            <textarea placeholder="Viết nội dung bài viết..."></textarea>
            <button class="submit-btn">Đăng</button>
            <button class="cancel-btn">Hủy</button>
          </div>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    <script src="./scripts/script.js"></script>
  </body>
</html>
