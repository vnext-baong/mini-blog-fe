<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="container">
        <div class="create-post">
          <img
            src="./assets/img/avt.jpg"
            alt="avt"
            width="60"
            height="60"
            class="avt"
          />
          <input
            type="text"
            data-i18n-placeholder="createPost.createPlaceholder"
            readonly
            onclick="openModal()"
          />
        </div>
        <div id="posts"></div>
        <div class="pagination">
          <select>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
          </select>
          <button class="prev-btn btn" onclick="prevPage()">‹</button>
          <span id="page-info"></span>
          <button class="next-btn btn" onclick="nextPage()">›</button>
        </div>
        <div class="modal">
          <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 data-i18n="createPost.createPost"></h2>
            <div class="title">
              <label for="post-title" data-i18n="createPost.title"></label>
              <input
                type="text"
                id="post-title"
                data-i18n-placeholder="createPost.titlePlaceholder"
              />
            </div>
            <div class="content">
              <label for="post-content" data-i18n="createPost.content"></label>
              <textarea
                id="post-content"
                data-i18n-placeholder="createPost.contentPlaceholder"
              ></textarea>
            </div>
            <div class="thumbnail">
              <label
                for="post-thumbnail"
                data-i18n="createPost.thumbnail"
              ></label>
              <input
                type="file"
                id="post-thumbnail"
                accept="image/*"
                onchange="previewImage()"
              />
              <div id="thumbnail-preview" class="thumbnail-preview"></div>
            </div>
            <div class="modal-footer">
              <button class="submit-btn" onclick="submitPost()">
                <span data-i18n="createPost.submit"></span>
                <div class="loader"></div>
              </button>
              <button
                class="cancel-btn"
                onclick="closeModal()"
                data-i18n="createPost.cancel"
              ></button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div id="chats"></div>
    <!-- <div id="footer"></div> -->
    <script src="./scripts/loading.js"></script>
    <script src="./scripts/config.js"></script>
    <script src="./scripts/translator.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/chat.js"></script>
  </body>
</html>
