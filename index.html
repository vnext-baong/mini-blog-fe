<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="container">
        <div class="create-post">
          <img
            src="./assets/img/avt.jpg"
            alt="avt"
            width="60"
            height="60"
            class="avt"
          />
          <input
            type="text"
            placeholder="Tạo bài viết..."
            readonly
            onclick="openModal()"
          />
        </div>
        <div id="posts"></div>
        <div class="pagination">
          <select>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="20">20</option>
          </select>
          <button class="prev-btn btn" onclick="prevPage()">‹</button>
          <span id="page-info"></span>
          <button class="next-btn btn" onclick="nextPage()">›</button>
        </div>
        <div class="modal">
          <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Tạo bài viết mới</h2>
            <div class="title">
              <label for="post-title">Tiêu đề bài viết:</label>
              <input
                type="text"
                id="post-title"
                placeholder="Nhập tiêu đề bài viết..."
              />
            </div>
            <div class="content">
              <label for="post-content">Nội dung bài viết:</label>
              <textarea
                id="post-content"
                placeholder="Viết nội dung bài viết..."
              ></textarea>
            </div>
            <div class="modal-footer">
              <button class="submit-btn" onclick="submitPost()">
                <span>Đăng</span>
                <div class="loader"></div>
              </button>
              <button class="cancel-btn" onclick="closeModal()">Hủy</button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- <div id="footer"></div> -->
    <script src="./scripts/loading.js"></script>
    <script src="./scripts/config.js"></script>
    <script src="./scripts/script.js"></script>
  </body>
</html>
