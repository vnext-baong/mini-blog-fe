<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog</title>
    <link rel="stylesheet" href="./styles/login.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="login-container">
        <h2 data-i18n="auth.login">Đăng nhập</h2>
        <form class="login-form">
          <div class="form-group">
            <label for="username" data-i18n="auth.username"
              >Tên đăng nhập:</label
            >
            <input
              type="text"
              id="username"
              name="username"
              data-i18n-placeholder="auth.username"
              placeholder="Nhập tên đăng nhập..."
              required
            />
            <p class="error-message" id="username-error"></p>
          </div>
          <div class="form-group">
            <label for="password" data-i18n="auth.password">Mật khẩu:</label>
            <input
              type="password"
              id="password"
              name="password"
              data-i18n-placeholder="auth.password"
              placeholder="Nhập mật khẩu..."
              required
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword()"
            ></button>
            <p class="error-message" id="password-error"></p>
          </div>
          <button type="button" class="btn submit-btn" onclick="login()">
            <span data-i18n="auth.login">Đăng nhập</span>
            <div class="loader"></div>
          </button>
          <div class="divider">
            <span data-i18n="auth.or">hoặc</span>
          </div>
          <button type="button" class="btn google-btn" onclick="loginWithGoogle()">
            <svg width="20" height="20" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span data-i18n="auth.loginGoogle">Đăng nhập bằng Google</span>
          </button>
        </form>
      </div>
      <div id="toast-container" class="toast-container"></div>
    </main>
    <!-- <div id="footer"></div> -->
    <script src="./scripts/loading.js"></script>
    <script src="./scripts/config.js"></script>
    <script src="./scripts/translator.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/login.js"></script>
  </body>
</html>
