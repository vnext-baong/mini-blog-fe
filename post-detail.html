<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog - Post Detail</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/post-detail.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />

    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <div class="main-layout">
      <main>
        <div class="container">
          <div id="post-detail" class="post-detail"></div>
          <div class="comments">
            <h2 data-i18n="postDetail.comment">Bình luận</h2>
            <div class="comment-container">
              <img
                src="./assets/img/avt.jpg"
                alt="avt"
                width="40"
                height="40"
                class="avt"
              />
              <input
                type="text"
                id="comment-input"
                data-i18n-placeholder="postDetail.commentPlaceholder"
              />
              <button id="submit-comment" class="btn" onclick="postComment()">
                <span data-i18n="postDetail.submit">Gửi</span>
                <div class="loader"></div>
              </button>
            </div>
            <div id="comments-list" class="comments-list"></div>
          </div>
        </div>
      </main>
      <div id="chats"></div>
    </div>
    <div id="footer"></div>
    <script src="./scripts/chat.js"></script>
    <script src="./scripts/loading.js"></script>
    <script src="./scripts/config.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/post-detail.js"></script>
    <script src="./scripts/translator.js"></script>
  </body>
</html>
