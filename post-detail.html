<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog - Post Detail</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="stylesheet" href="./styles/post-detail.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="container">
        <div id="post-detail" class="post-detail"></div>
        <div class="comments">
          <h2>Bình luận</h2>
          <div class="comment-container">
            <img
              src="./assets/img/avt.jpg"
              alt="avt"
              width="40"
              height="40"
              class="avt"
            />
            <input
              type="text"
              id="comment-input"
              placeholder="Viết bình luận..."
            />
            <button id="submit-comment" class="btn" onclick="postComment()">
              Gửi
            </button>
          </div>
          <div id="comments-list" class="comments-list"></div>
        </div>
      </div>
    </main>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/post-detail.js"></script>
  </body>
</html>
