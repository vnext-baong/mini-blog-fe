<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="./styles/profile.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="profile-container">
        <div class="tab-menu">
          <button
            class="tab-btn active"
            onclick="openTab(event, 'edit-profile')"
          >
            Sửa thông tin
          </button>
          <button class="tab-btn" onclick="openTab(event, 'change-password')">
            Đổi mật khẩu
          </button>
        </div>
        <div id="edit-profile" class="tab-content active">
          <h2>Thông tin cá nhân</h2>
          <form id="edit-profile-form">
            <div class="form-group">
              <label for="name">Tên:</label>
              <input type="text" id="name" name="name" required />
              <p class="error-message" id="name-error"></p>
            </div>

            <div class="form-group">
              <label for="username">Tên người dùng:</label>
              <input type="text" id="username" name="username" required />
              <p class="error-message" id="username-error"></p>
            </div>

            <button type="submit" class="btn">Lưu thay đổi</button>
          </form>
        </div>
        <div id="change-password" class="tab-content">
          <h2>Đổi mật khẩu</h2>
          <form id="change-password-form">
            <div class="form-group">
              <label for="old-password">Mật khẩu cũ:</label>
              <input
                type="password"
                id="old-password"
                name="old-password"
                required
              />
              <button
                type="button"
                class="toggle-password old-password-toggle"
                onclick="toggleOldPassword()"
              ></button>
              <p class="error-message" id="old-password-error"></p>
            </div>

            <div class="form-group">
              <label for="new-password">Mật khẩu mới:</label>
              <input
                type="password"
                id="new-password"
                name="new-password"
                required
              />
              <button
                type="button"
                class="toggle-password new-password-toggle"
                onclick="toggleNewPassword()"
              ></button>
              <p class="error-message" id="new-password-error"></p>
            </div>

            <div class="form-group">
              <label for="confirm-password">Xác nhận mật khẩu mới:</label>
              <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                required
              />
              <button
                type="button"
                class="toggle-password confirm-password-toggle"
                onclick="toggleConfirmPassword()"
              ></button>
              <p class="error-message" id="confirm-password-error"></p>
            </div>

            <button type="button" class="btn-save" onclick="changePass()">
              Đổi mật khẩu
            </button>
          </form>
        </div>
      </div>
    </main>
    <!-- <div id="footer"></div> -->
    <script src="./scripts/profile.js"></script>
    <script src="./scripts/config.js"></script>
    <script src="./scripts/loading.js"></script>
    <script src="./scripts/translator.js"></script>
    <script src="./scripts/script.js"></script>
  </body>
</html>
