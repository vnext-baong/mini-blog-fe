<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog</title>
    <link rel="stylesheet" href="./styles/register.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="reg-container">
        <h2 data-i18n="auth.register">Đăng ký</h2>
        <form class="reg-form">
          <div class="form-group">
            <label for="username" data-i18n="auth.username"
              >Tên đăng nhập:</label
            >
            <input
              type="text"
              id="username"
              name="username"
              data-i18n-placeholder="auth.usernamePlaceholder"
              required
            />
            <p class="error-message" id="username-error"></p>
          </div>
          <div class="form-group">
            <label for="email" data-i18n="auth.email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              data-i18n-placeholder="auth.emailPlaceholder"
              required
            />
            <p class="error-message" id="email-error"></p>
          </div>
          <div class="form-group">
            <label for="name" data-i18n="auth.name">Họ và tên:</label>
            <input
              type="text"
              id="name"
              name="name"
              data-i18n-placeholder="auth.namePlaceholder"
              required
            />
            <p class="error-message" id="name-error"></p>
          </div>
          <div class="form-group">
            <label for="password" data-i18n="auth.password">Mật khẩu:</label>
            <input
              type="password"
              id="password"
              name="password"
              data-i18n-placeholder="auth.passwordPlaceholder"
              required
            />
            <button
              type="button"
              class="toggle-password password-toggle"
              onclick="togglePassword()"
            ></button>
            <p class="error-message" id="password-error"></p>
          </div>
          <div class="form-group">
            <label for="confirm-password" data-i18n="auth.confirmPassword"
              >Xác nhận mật khẩu:</label
            >
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              data-i18n-placeholder="auth.confirmPasswordPlaceholder"
              required
            />
            <button
              type="button"
              class="toggle-password confirm-password-toggle"
              onclick="toggleConfirmPassword()"
            ></button>
            <p class="error-message" id="confirm-password-error"></p>
          </div>
          <button type="button" class="btn submit-btn" onclick="register()">
            <span data-i18n="auth.register">Đăng ký</span>
            <div class="loader"></div>
          </button>
        </form>
      </div>
      <div id="toast-container" class="toast-container"></div>
    </main>
    <!-- <div id="footer"></div> -->
    <script src="./scripts/loading.js"></script>
    <script src="./scripts/config.js"></script>
    <script src="./scripts/translator.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/register.js"></script>
  </body>
</html>
