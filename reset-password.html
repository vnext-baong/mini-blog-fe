<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog - Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="./styles/reset-password.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="reset-password-container">
        <h2 data-i18n="auth.resetPassword">Đặt lại mật khẩu</h2>
        <form class="reset-password-form">
          <div class="form-group">
            <label for="password" data-i18n="auth.newPassword"
              >Mật khẩu mới:</label
            >
            <input
              type="password"
              id="password"
              name="password"
              data-i18n-placeholder="auth.newPasswordPlaceholder"
              placeholder="Nhập mật khẩu mới..."
              required
            />
            <button
              type="button"
              class="toggle-password password-toggle"
              onclick="togglePassword()"
            ></button>
            <p class="error-message" id="password-error"></p>
          </div>
          <div class="form-group">
            <label for="confirm-password" data-i18n="auth.confirmNewPassword"
              >Xác nhận mật khẩu mới:</label
            >
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              data-i18n-placeholder="auth.confirmNewPasswordPlaceholder"
              placeholder="Xác nhận mật khẩu mới..."
              required
            />
            <button
              type="button"
              class="toggle-password confirm-password-toggle"
              onclick="toggleConfirmPassword()"
            ></button>
            <p class="error-message" id="confirm-password-error"></p>
          </div>
          <button
            type="button"
            class="btn submit-btn"
            onclick="resetPassword()"
          >
            <span data-i18n="auth.resetPasswordBtn">Xác nhận</span>
            <div class="loader"></div>
          </button>
        </form>
      </div>
      <div id="toast-container" class="toast-container"></div>
    </main>
    <!-- <div id="footer"></div> -->
    <script src="./scripts/loading.js"></script>
    <script src="./scripts/config.js"></script>
    <script src="./scripts/translator.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/reset-password.js"></script>
  </body>
</html>
