<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Blog</title>
    <link rel="stylesheet" href="./styles/sent-email.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
  </head>
  <body>
    <div id="header"></div>
    <main>
      <div class="sent-mail-container">
        <div class="sent-mail-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 13V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8"></path>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            <path d="m16 19 2 2 4-4"></path>
          </svg>
        </div>
        <div class="sent-mail-content">
          <h2 data-i18n="auth.sentMail">Email đã được gửi</h2>
          <p data-i18n="auth.sentMailMessage">
            Vui lòng kiểm tra hộp thư của bạn để xác minh email. Nếu bạn không
            nhận được email, hãy kiểm tra thư mục spam hoặc thử gửi lại.
          </p>
          <div class="sent-mail-actions">
            <button id="resend-btn" class="resend-btn" data-i18n="auth.resendEmail">Gửi lại email</button>
            <a href="login.html" class="back-home-btn" data-i18n="auth.backToLogin">Quay lại đăng nhập</a>
          </div>
        </div>
      </div>
      <div id="toast-container" class="toast-container"></div>
    </main>
    <div id="footer"></div>
    <script src="./scripts/loading.js"></script>
    <script src="./scripts/config.js"></script>
    <script src="./scripts/translator.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/sent-email.js"></script>
  </body>
</html>
