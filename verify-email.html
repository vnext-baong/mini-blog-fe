<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Your Email</title>
    <link rel="stylesheet" href="./styles/login.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Playwrite+IE:wght@100..400&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
    <style>
      body {
        background-color: #f4f7f6;
      }
      main {
        width: 100%;
      }
      .verify-container {
        max-width: 420px;
        position: relative;
        margin: auto;
        top: 150px;
        text-align: center;
        background: #fff;
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .verify-container h2 {
        font-size: 26px;
        text-align: center;
        margin-bottom: 25px;
        color: #000080;
        font-weight: bold;
      }
      .spinner {
        border: 4px solid rgba(0, 0, 128, 0.1);
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border-left-color: #000080;
        animation: spin 1s linear infinite;
        margin: 0 auto 25px auto;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      #status-message {
        font-size: 1.1rem;
        color: #444;
        margin-top: 15px;
        line-height: 1.6;
      }
      .status-icon {
        display: none;
        width: 54px;
        height: 54px;
        margin: 0 auto 25px auto;
        color: #28a745;
      }
      .status-icon.error {
        color: #dc3545;
      }
      .status-icon svg {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="header"></div>
    <main style="min-height: calc(100vh - 200px)">
      <div class="verify-container">
        <h2>Xác thực Email</h2>
        <div id="loading-spinner" class="spinner"></div>
        <div id="status-icon" class="status-icon"></div>
        <div id="status-message">Đang xác thực email của bạn...</div>
      </div>
      <div id="toast-container" class="toast-container"></div>
    </main>
    <div id="footer"></div>

    <script src="./scripts/loading.js"></script>
    <script src="./scripts/config.js"></script>
    <script src="./scripts/translator.js"></script>
    <script src="./scripts/script.js"></script>
    <script src="./scripts/verify-email.js"></script>
  </body>
</html>
